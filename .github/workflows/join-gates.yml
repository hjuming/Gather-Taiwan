name: Gather Join Gates

on:
  pull_request:
    paths:
      - "apps/join/**"
      - ".github/workflows/join-gates.yml"
  push:
    branches:
      - main
    paths:
      - "apps/join/**"
      - ".github/workflows/join-gates.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/join
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/join/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Full test suite
        run: pnpm test
      - name: Security suite only
        run: pnpm test:security
      - run: pnpm build
      - run: pnpm smoke
