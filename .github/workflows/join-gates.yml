name: Gather Join Gates

on:
  pull_request:
    paths:
      - "apps/join/**"
      - ".github/workflows/join-gates.yml"
  push:
    branches:
      - main
    paths:
      - "apps/join/**"
      - ".github/workflows/join-gates.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/join
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/join/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Full test suite
        run: pnpm test
      - name: Security suite only
        run: pnpm test:security
      - run: pnpm build
      - run: pnpm smoke
  local-supabase:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/join
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/join/pnpm-lock.yaml
      - uses: supabase/setup-cli@v1
        with:
          version: 2.106.0
      - run: pnpm install --frozen-lockfile
      - name: Start isolated local Supabase project
        run: pnpm start
      - name: Reset probe and run real PostgreSQL concurrency harness
        run: pnpm test:p1-01
      - name: Verify canonical schema behavior
        env:
          GATHER_JOIN_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:58322/postgres
        run: pnpm verify:p1-02
      - name: Finally stop only the gather-join-p1 local Supabase project
        if: always()
        run: pnpm stop
