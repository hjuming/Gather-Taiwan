name: Gather Join Gates

on:
  pull_request:
    paths:
      - "apps/join/**"
      - ".github/workflows/join-gates.yml"
  push:
    branches:
      - main
    paths:
      - "apps/join/**"
      - ".github/workflows/join-gates.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/join
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/join/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Release baseline gates
        env:
          GATHER_JOIN_CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm verify:release-baseline
      - name: Upload release baseline report
        id: release_baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gather-join-release-baseline-${{ github.run_id }}
          path: apps/join/.reports/release-baseline.json
          if-no-files-found: warn
      - name: Write CI provenance manifest
        if: always()
        env:
          GATHER_JOIN_CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATHER_JOIN_BASELINE_ARTIFACT_NAME: gather-join-release-baseline-${{ github.run_id }}
          GATHER_JOIN_BASELINE_ARTIFACT_ID: ${{ steps.release_baseline.outputs.artifact-id }}
          GATHER_JOIN_BASELINE_ARTIFACT_URL: ${{ steps.release_baseline.outputs.artifact-url }}
        run: pnpm verify:ci-provenance
      - name: Upload CI provenance manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gather-join-release-provenance-${{ github.run_id }}
          path: apps/join/.reports/release-baseline-provenance.json
          if-no-files-found: warn
  local-supabase:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/join
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/join/pnpm-lock.yaml
      - uses: supabase/setup-cli@v1
        with:
          version: 2.106.0
      - run: pnpm install --frozen-lockfile
      - name: Start isolated local Supabase project
        run: pnpm start
      - name: Reset probe and run real PostgreSQL concurrency harness
        run: pnpm test:p1-01
      - name: Finally stop only the gather-join-p1 local Supabase project
        if: always()
        run: pnpm stop
